<svg viewBox="0 0 1000 290" width="1000" height="290" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Saish">
<style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .7s ease forwards}
@keyframes fade{to{opacity:1}}
.rot{opacity:0;animation:rot 12s linear infinite}
@keyframes rot{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%{opacity:0}100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .draw,.rise,.fade,.rot,.blink,.pulse{animation:none}
  .draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.rot{opacity:0}.rot.r0{opacity:1}
}
</style>
<g class="rise" style="animation-delay:0.10s"><text class="mono" x="48" y="34" font-size="16" fill="#1F2328" >I build backend systems, AI infrastructure and developer tools,</text></g>
<g class="rise" style="animation-delay:0.25s"><text class="mono" x="48" y="62" font-size="15" fill="#59636E" >and I care about what happens after the demo: uptime, evals, security, the boring parts.</text></g>
<line class="draw" x1="48" y1="92" x2="952" y2="92" stroke="#D0D7DE"/>
<g class="rise" style="animation-delay:0.40s"><text class="mono" x="48" y="128" font-size="11" fill="#8C959F" letter-spacing="2.5" >MINDSET</text><text class="mono" x="170" y="128" font-size="15" fill="#1F2328" >High agency. I own problems end to end and don&#x27;t wait for the next ticket.</text></g>
<g class="rise" style="animation-delay:0.55s"><text class="mono" x="48" y="162" font-size="11" fill="#8C959F" letter-spacing="2.5" >BUILD</text><text class="mono" x="170" y="162" font-size="15" fill="#1F2328" >Hand me a rough idea and I&#x27;ll take it to production, then keep it running.</text></g>
<g class="rise" style="animation-delay:0.70s"><text class="mono" x="48" y="196" font-size="11" fill="#8C959F" letter-spacing="2.5" >PROOF</text><text class="mono" x="170" y="196" font-size="15" fill="#1F2328" >Won Monad Blitz solo in 6 hours after my team dropped out the night before.</text></g>
<g class="rise" style="animation-delay:0.85s"><text class="mono" x="48" y="230" font-size="11" fill="#8C959F" letter-spacing="2.5" >WORKFLOW</text><text class="mono" x="170" y="230" font-size="15" fill="#1F2328" >I build with AI agents every day and review every line they write.</text></g>
<g class="rise" style="animation-delay:1.00s"><text class="mono" x="48" y="264" font-size="11" fill="#8C959F" letter-spacing="2.5" >NOW</text><text class="mono" x="170" y="264" font-size="15" fill="#B35900" >SWE Intern @ Not Your Idea · open to full-time roles from January 2027</text></g>
</svg>
