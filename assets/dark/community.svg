<svg viewBox="0 0 1000 128" width="1000" height="128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Community">
<style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .7s ease forwards}
@keyframes fade{to{opacity:1}}
.rot{opacity:0;animation:rot 12s linear infinite}
@keyframes rot{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%{opacity:0}100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .draw,.rise,.fade,.rot,.blink,.pulse{animation:none}
  .draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.rot{opacity:0}.rot.r0{opacity:1}
}
</style>
<g class="rise" style="animation-delay:0.10s"><text class="mono" x="48" y="34" font-size="14" fill="#F0A35E" >▸</text><text class="mono" x="72" y="34" font-size="15" fill="#E6EDF3" >AWS Student Builder Group, KJSCE</text><text class="mono" x="952" y="34" font-size="13" fill="#9198A1" text-anchor="end" >founded the first chapter · 500+ developers</text></g>
<g class="rise" style="animation-delay:0.25s"><text class="mono" x="48" y="68" font-size="14" fill="#F0A35E" >▸</text><text class="mono" x="72" y="68" font-size="15" fill="#E6EDF3" >Computer Society of India, KJSCE</text><text class="mono" x="952" y="68" font-size="13" fill="#9198A1" text-anchor="end" >Joint General Secretary · 1,000+ members</text></g>
<g class="rise" style="animation-delay:0.40s"><text class="mono" x="48" y="102" font-size="14" fill="#F0A35E" >▸</text><text class="mono" x="72" y="102" font-size="15" fill="#E6EDF3" >Perplexity</text><text class="mono" x="952" y="102" font-size="13" fill="#9198A1" text-anchor="end" >campus ambassador</text></g>
</svg>
