<svg viewBox="0 0 1000 390" width="1000" height="390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Saish Korgaonkar, software engineer">
<style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .7s ease forwards}
@keyframes fade{to{opacity:1}}
.rot{opacity:0;animation:rot 12s linear infinite}
@keyframes rot{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%{opacity:0}100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .draw,.rise,.fade,.rot,.blink,.pulse{animation:none}
  .draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.rot{opacity:0}.rot.r0{opacity:1}
}
</style>

<line class="draw" x1="48" y1="58" x2="952" y2="58" stroke="#30363D"/>
<g class="fade" style="animation-delay:0.10s">
  <text class="mono" x="48" y="42" font-size="11" fill="#6E7681" letter-spacing="3.5" >README — SAISHKORGAONKAR</text>
  <text class="mono" x="952" y="42" font-size="11" fill="#6E7681" text-anchor="end" letter-spacing="3.5" >MUMBAI, IN — 19.07° N</text>
</g>
<g class="rise" style="animation-delay:0.40s"><text class="mono" x="44" y="168" font-size="72" fill="#E6EDF3" letter-spacing="-2" >Saish Korgaonkar</text></g>
<g class="fade" style="animation-delay:0.70s"><text class="mono" x="48" y="210" font-size="18" fill="#9198A1" >Software engineer. Final-year Computer Engineering, K. J. Somaiya.</text></g>
<g class="fade" style="animation-delay:1.00s">
  <text class="mono" x="48" y="286" font-size="12.5" fill="#6E7681" letter-spacing="1" >focus  ▸</text>
  <g class="rot r0" style="animation-delay:1.6s"><text class="mono" x="140" y="286" font-size="14" fill="#F0A35E" letter-spacing="0.5" >backend systems · AI infrastructure · developer tools</text></g><g class="rot r1" style="animation-delay:4.6s"><text class="mono" x="140" y="286" font-size="14" fill="#F0A35E" letter-spacing="0.5" >idea → production → keeps it running</text></g><g class="rot r2" style="animation-delay:7.6s"><text class="mono" x="140" y="286" font-size="14" fill="#F0A35E" letter-spacing="0.5" >4 hackathon wins · $25K+ in prizes and credits</text></g><g class="rot r3" style="animation-delay:10.6s"><text class="mono" x="140" y="286" font-size="14" fill="#F0A35E" letter-spacing="0.5" >1 of 43 builders · IIMA Ventures AI Residency</text></g>
</g>
<g class="fade" style="animation-delay:1.30s">
  <text class="mono" x="48" y="332" font-size="13" fill="#6E7681" >$ whoami --short</text>
  <rect class="blink" x="186" y="321" width="8" height="15" fill="#F0A35E"/>
</g>
<line class="draw" x1="48" y1="370" x2="952" y2="370" stroke="#30363D" style="animation-delay:.6s"/>

</svg>
