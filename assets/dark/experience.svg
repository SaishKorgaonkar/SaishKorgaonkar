<svg viewBox="0 0 1000 492" width="1000" height="492" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience">
<style>
.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.fade{opacity:0;animation:fade .7s ease forwards}
@keyframes fade{to{opacity:1}}
.rot{opacity:0;animation:rot 12s linear infinite}
@keyframes rot{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%{opacity:0}100%{opacity:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@media (prefers-reduced-motion:reduce){
  .draw,.rise,.fade,.rot,.blink,.pulse{animation:none}
  .draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.rot{opacity:0}.rot.r0{opacity:1}
}
</style>
<line x1="150" y1="18" x2="150" y2="436" stroke="#30363D"/>
<g class="rise" style="animation-delay:0.10s"><text class="mono" x="48" y="36" font-size="12" fill="#F0A35E" letter-spacing="1.5" >2026 —</text><circle class="pulse" cx="150" cy="32" r="4" fill="#F0A35E"/><circle cx="150" cy="32" r="4" fill="#F0A35E"/><text class="mono" x="172" y="36" font-size="15" fill="#E6EDF3" >Not Your Idea · Software Engineering Intern</text><text class="mono" x="172" y="62" font-size="14" fill="#9198A1" >production services in Elixir, Phoenix and Ash on PostgreSQL, deployed on Fly.io</text><text class="mono" x="172" y="84" font-size="14" fill="#9198A1" >auth, transactional write paths, LLM tracing and evals · React 19 + TanStack frontend</text></g>
<g class="rise" style="animation-delay:0.25s"><text class="mono" x="48" y="136" font-size="12" fill="#F0A35E" letter-spacing="1.5" >2026</text><circle cx="150" cy="132" r="4" fill="#30363D"/><text class="mono" x="172" y="136" font-size="15" fill="#E6EDF3" >IIMA Ventures · AI Summer Resident · Ahmedabad</text><text class="mono" x="172" y="162" font-size="14" fill="#9198A1" >selected as 1 of 43 builders from 11,000+ applicants</text><text class="mono" x="172" y="184" font-size="14" fill="#9198A1" >built a creator second brain and reel video analysis with a startup team</text></g>
<g class="rise" style="animation-delay:0.40s"><text class="mono" x="48" y="236" font-size="12" fill="#F0A35E" letter-spacing="1.5" >2025–26</text><circle cx="150" cy="232" r="4" fill="#30363D"/><text class="mono" x="172" y="236" font-size="15" fill="#E6EDF3" >Commtel Networks · Machine Learning Intern</text><text class="mono" x="172" y="262" font-size="14" fill="#9198A1" >distributed edge monitoring with local LLMs, anomaly detection and alerting</text><text class="mono" x="172" y="284" font-size="14" fill="#9198A1" >MCP servers for agentic workflows</text></g>
<g class="rise" style="animation-delay:0.55s"><text class="mono" x="48" y="336" font-size="12" fill="#F0A35E" letter-spacing="1.5" >2025</text><circle cx="150" cy="332" r="4" fill="#30363D"/><text class="mono" x="172" y="336" font-size="15" fill="#E6EDF3" >DCB Bank · Business Intelligence Intern</text><text class="mono" x="172" y="362" font-size="14" fill="#9198A1" >serverless RAG and OCR pipelines on AWS Lambda, S3 and Textract</text><text class="mono" x="172" y="384" font-size="14" fill="#9198A1" >fixed cold-start latency in a production inference path</text></g>
<g class="rise" style="animation-delay:0.70s"><text class="mono" x="48" y="436" font-size="12" fill="#F0A35E" letter-spacing="1.5" >— 2027</text><circle cx="150" cy="432" r="4" fill="#30363D"/><text class="mono" x="172" y="436" font-size="15" fill="#E6EDF3" >K. J. Somaiya College of Engineering · B.Tech Computer Engineering</text><text class="mono" x="172" y="462" font-size="14" fill="#9198A1" >CGPA 9.64 · Honours in Data Science and Analytics</text></g>
</svg>
